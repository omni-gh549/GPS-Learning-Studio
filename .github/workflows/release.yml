name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-smoke-release:
    name: Build, test, smoke, and release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run full test suite
        run: python -m unittest discover -v

      - name: Build Windows executable
        run: pyinstaller --clean GPS-Learning-Studio.spec

      - name: Smoke test packaged executable
        run: .\dist\GPS-Learning-Studio.exe --smoke-test

      - name: Generate executable checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\GPS-Learning-Studio.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GPS-Learning-Studio.exe" | Set-Content -Encoding ascii .\dist\GPS-Learning-Studio.exe.sha256

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME `
            .\dist\GPS-Learning-Studio.exe `
            .\dist\GPS-Learning-Studio.exe.sha256 `
            --title $env:GITHUB_REF_NAME `
            --notes-file RELEASE_NOTES.md
